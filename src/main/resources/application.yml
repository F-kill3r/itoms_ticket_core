spring:
  application:
    name: TicketCore
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DDL_ENV}
    open-in-view: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
springdoc:
  swagger-ui:
    path: ${SWAGGER_PATH}/swagger-ui.html
  api-docs:
    path: ${SWAGGER_PATH}/api-docs

cors:
  allowed:
    path: ${ALLOWED_PATH}
    pattern: ${ALLOWED_PATTERN}
    method: ${ALLOWED_METHOD}

